name: CopyM8
options:
  bundleIdPrefix: com.vatsa
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.2.2
targets:
  CopyM8:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [CopyM8]
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: CopyM8/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
